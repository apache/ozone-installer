---
# Global defaults
cluster_mode: "non-ha"        # non-ha | ha

# Source selection
ozone_version: "2.0.0"        # "2.0.0" | "local"
dl_url: "https://dlcdn.apache.org/ozone"

# Local snapshot settings
local_shared_path: ""
local_ozone_dirname: ""

# Install and data directories
install_base: "/opt/ozone"
data_base: "/data/ozone"

# Java settings
jdk_major: 17
ozone_java_home: ""           # autodetected if empty

# Service user/group
service_user: "ozone"
service_group: "ozone"

# Runtime and behavior
use_sudo: true
ozone_opts: "-Xmx1024m -XX:ParallelGCThreads=8"
service_command_timeout: 300  # seconds for service init/start commands

# SSH bootstrap
allow_cluster_ssh_key_deploy: false
ssh_public_key_path: ""       # optional path on controller to a public key to install
ssh_private_key_path: ""      # optional path to private key to copy for cluster identity

# Markers for profile management
JAVA_MARKER: "Apache Ozone Installer Java Home"
ENV_MARKER: "Apache Ozone Installer Env"

# Service ports — Ozone upstream defaults.
# ---
# SCM
port_scm_client: 19860                # ozone.scm.client.port
port_scm_datanode: 19861              # ozone.scm.datanode.port
port_scm_block_client: 19863          # ozone.scm.block.client.port
port_scm_http: 19876                  # ozone.scm.http-address
port_scm_ratis: 19894                 # ozone.scm.ratis.port
port_scm_grpc: 19895                  # ozone.scm.grpc.port
# OM
port_om_rpc: 19862                    # ozone.om.port (binds to hostname, not 0.0.0.0)
port_om_http: 19874                   # ozone.om.http-address
port_om_ratis: 19872                  # ozone.om.ratis.port
port_om_grpc: 18981                   # ozone.om.grpc.port
# Recon
port_recon_http: 19888                # ozone.recon.http-address
port_recon_datanode: 19891            # ozone.recon.datanode.port & ozone.recon.address
# S3G
port_s3g_http: 19878                  # ozone.s3g.http-address
port_s3g_admin: 29878                 # ozone.s3g.webadmin.http-address
# Datanode
port_datanode_http: 19882             # hdds.datanode.http-address
port_datanode_replication: 19886      # hdds.datanode.replication.port
port_datanode_ratis_ipc: 19858        # hdds.container.ratis.ipc.port & hdds.datanode.ipc
port_datanode_client: 19859           # hdds.container.ipc.port (XceiverServerGrpc bind)
                                      # DatanodeDetails.clientPort is populated from this automatically
port_datanode_ratis_server: 19856     # dfs.container.ratis.datanode.port & hdds.container.ratis.server.port
port_datanode_ratis_admin: 19857      # dfs.container.ratis.admin.port
