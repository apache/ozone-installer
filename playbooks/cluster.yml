---
- name: "Ozone Cluster Deployment"
  hosts: all
  gather_facts: false
  vars:
    # Expect cluster_mode to be passed in (non-ha | ha). Fallback to non-ha.
    cluster_mode: "{{ cluster_mode | default('non-ha') }}"
    ha_enabled: "{{ cluster_mode == 'ha' }}"
    # data_base_list: comma-separated data_base expanded to list (set in pre_tasks)
  pre_tasks:

    - name: "Pre-install: Parse data_base into list (supports comma-separated dirs)"
      set_fact:
        data_base_list: "{{ ((data_base | default('')).split(',') | map('trim') | select | list) | default([data_base | default('/data/ozone')], true) }}"

    - name: "Pre-install: Parse metadata_base into list (supports comma-separated dirs)"
      set_fact:
        metadata_base_list: "{{ ((metadata_base | default(data_base) | default('')).split(',') | map('trim') | select | list) | default([metadata_base | default(data_base) | default('/data/ozone')], true) }}"

    - name: "Pre-install: Gather facts"
      setup:

    - name: "Pre-install: Install ACL package (needed for become_user when controller is macOS)"
      package:
        name: acl
        state: present
      when: ansible_os_family in ['Debian', 'RedHat', 'Suse']
      become: true

    - name: "Pre-install: Ensure Ansible remote tmp exists"
      file:
        path: "{{ (ansible_env.TMPDIR | default('/tmp')) ~ '/.ansible-' ~ ansible_user_id }}"
        state: directory
        mode: "0700"
        owner: "{{ ansible_user_id }}"

  roles:
    - role: ozone_stop
      tags: ["ozone_stop", "cleanup"]
      when: (do_cleanup | default(false))
    - role: ozone_cleanup
      tags: ["cleanup"]
      when: (do_cleanup | default(false))
    - role: ozone_user
      tags: ["ozone_user"]
    - role: ssh_bootstrap
      tags: ["ssh_bootstrap"]
    - role: java
      tags: ["java"]
    - role: ozone_layout
      tags: ["ozone_layout"]
    - role: ozone_fetch
      tags: ["ozone_fetch"]
    - role: ozone_config
      tags: ["ozone_config"]
    - role: ozone_service
      tags: ["ozone_service"]

- name: "Ozone Cluster Smoke Test"
  hosts: "{{ groups['om'] | list | first }}"
  gather_facts: false
  roles:
    - role: ozone_ui
      tags: ["ozone_ui"]
    - role: ozone_smoke_cluster
      tags: ["ozone_smoke_cluster"]

- name: "Ozone S3G Smoke Test"
  hosts: "{{ (groups.get('s3g', []) | list)[0] if (groups.get('s3g', []) | length) > 0 else 'never' }}"
  gather_facts: false
  roles:
    - role: ozone_smoke_s3g
      tags: ["ozone_smoke_s3g"]

- name: "Display UI Endpoints"
  hosts: "{{ groups['om'] | list | first }}"
  gather_facts: false
  post_tasks:
    - name: "Build UI endpoints display lines"
      set_fact:
        ui_display_lines: >-
          {{
            [
              '',
              '==========================================',
              '   Ozone Cluster UI Endpoints',
              '==========================================',
              '',
              'OM UI:'
            ] +
            (endpoint_urls.om | map('regex_replace', '^', '  - ') | list) +
            ['', 'SCM UI:'] +
            (endpoint_urls.scm | map('regex_replace', '^', '  - ') | list) +
            ['', 'Recon UI:'] +
            ((endpoint_urls.recon | length > 0) | ternary(
              endpoint_urls.recon | map('regex_replace', '^', '  - ') | list,
              ['  - Not configured']
            )) +
            ['', 'S3 Gateway (HTTP):'] +
            ((endpoint_urls.s3g_http | length > 0) | ternary(
              ['  - ' ~ (endpoint_urls.s3g_http | first)],
              ['  - Not configured']
            )) +
            ['', 'S3 Gateway (Web Admin):'] +
            ((endpoint_urls.s3g_admin | length > 0) | ternary(
              ['  - ' ~ (endpoint_urls.s3g_admin | first)],
              ['  - Not configured']
            )) +
            ['', 'Datanode UI:'] +
            ((endpoint_urls.datanode | length > 0) | ternary(
              ['  - ' ~ (endpoint_urls.datanode | first)],
              ['  - Not configured']
            )) +
            [
              '',
              '==========================================',
              'UI endpoints also saved to: ' ~ (controller_logs_dir | default('logs')) ~ '/endpoint_urls.json',
              '==========================================',
              ''
            ]
          }}
      run_once: true
      when: endpoint_urls is defined
      tags: ["always"]

    - name: "Display UI Endpoints Summary"
      debug:
        msg: "{{ ui_display_lines }}"
      run_once: true
      when: endpoint_urls is defined
      tags: ["always"]
