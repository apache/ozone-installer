# -----------------------------------------------------------------------
# Single unified playbook. All roles are gated by the 'actions' list var.
#
# Valid actions : clean | install | start | stop
# Inclusivity   : 'install' implies 'start'
#                 'clean'   implies 'stop' first
# Exclusivity   : 'start' and 'stop' cannot be combined
#
# Examples:
#   actions: [install]          → install + start
#   actions: [start]            → start only
#   actions: [stop]             → stop only
#   actions: [clean]            → stop + remove all dirs
#   actions: [clean, install]   → full clean reinstall
# -----------------------------------------------------------------------

---
- name: "Ozone Cluster"
  hosts: all
  gather_facts: false
  vars:
    cluster_mode: "{{ cluster_mode | default('non-ha') }}"
    ha_enabled: "{{ cluster_mode == 'ha' }}"
    actions: "{{ actions | default(['install']) }}"
    # Derived convenience booleans (evaluated once here, used in role when: clauses)
    _do_stop:    "{{ 'stop'    in actions or 'clean'   in actions }}"
    _do_clean:   "{{ 'clean'   in actions }}"
    _do_install: "{{ 'install' in actions }}"
    _do_start:   "{{ 'start'   in actions or 'install' in actions }}"

  pre_tasks:

    - name: "Validate: 'start' and 'stop' cannot be combined"
      fail:
        msg: "Invalid actions: 'start' and 'stop' cannot be used together."
      when: "'start' in actions and 'stop' in actions"
      tags: ["always"]

    - name: "Pre-install: Parse data_base into list (supports comma-separated dirs)"
      set_fact:
        data_base_list: "{{ ((data_base | default('')).split(',') | map('trim') | select | list) | default([data_base | default('/data/ozone')], true) }}"
      when: _do_install | bool or _do_clean | bool

    - name: "Pre-install: Parse metadata_base into list (supports comma-separated dirs)"
      set_fact:
        metadata_base_list: "{{ ((metadata_base | default(data_base) | default('')).split(',') | map('trim') | select | list) | default([metadata_base | default(data_base) | default('/data/ozone')], true) }}"
      when: _do_install | bool or _do_clean | bool

    - name: "Gather facts"
      setup:
      when: _do_install | bool or _do_start | bool

    - name: "Pre-install: Install ACL package (needed for become_user when controller is macOS)"
      package:
        name: acl
        state: present
      when: _do_install | bool and ansible_os_family in ['Debian', 'RedHat', 'Suse']
      become: true

    - name: "Pre-install: Ensure Ansible remote tmp exists"
      file:
        path: "{{ (ansible_env.TMPDIR | default('/tmp')) ~ '/.ansible-' ~ (ansible_user_id | default(ansible_user) | default('ansible')) }}"
        state: directory
        mode: "0700"
        owner: "{{ ansible_user_id | default(ansible_user) | default('ansible') }}"
      when: _do_install | bool or _do_start | bool

  roles:
    - role: ozone_stop
      tags: ["ozone_stop"]
      when: _do_stop | bool

    - role: ozone_cleanup
      tags: ["ozone_cleanup"]
      when: _do_clean | bool

    - role: ozone_user
      tags: ["ozone_user"]
      when: _do_install | bool

    - role: ssh_bootstrap
      tags: ["ssh_bootstrap"]
      when: _do_install | bool

    - role: java
      tags: ["java"]
      when: _do_install | bool

    - role: ozone_layout
      tags: ["ozone_layout"]
      when: _do_install | bool

    - role: ozone_fetch
      tags: ["ozone_fetch"]
      when: _do_install | bool

    - role: ozone_config
      tags: ["ozone_config"]
      when: _do_install | bool

    - role: ozone_service
      tags: ["ozone_service"]
      when: _do_start | bool


- name: "Ozone Cluster Smoke Test"
  hosts: "{{ groups['om'] | list | first if ('install' in (actions | default([])) or 'start' in (actions | default([]))) else 'never' }}"
  gather_facts: false
  roles:
    - role: ozone_ui
      tags: ["ozone_ui"]
    - role: ozone_smoke_cluster
      tags: ["ozone_smoke_cluster"]

- name: "Ozone S3G Smoke Test"
  hosts: "{{ ((groups.get('s3g', []) | list)[0] if (groups.get('s3g', []) | length) > 0 else 'never') if ('install' in (actions | default([])) or 'start' in (actions | default([]))) else 'never' }}"
  gather_facts: false
  roles:
    - role: ozone_smoke_s3g
      tags: ["ozone_smoke_s3g"]

- name: "Display UI Endpoints"
  hosts: "{{ groups['om'] | list | first if ('install' in (actions | default([])) or 'start' in (actions | default([]))) else 'never' }}"
  gather_facts: false
  post_tasks:
    - name: "Build UI endpoints display lines"
      set_fact:
        ui_display_lines: >-
          {{
            [
              '',
              '==========================================',
              '   Ozone Cluster UI Endpoints',
              '==========================================',
              '',
              'OM UI:'
            ] +
            (endpoint_urls.om | map('regex_replace', '^', '  - ') | list) +
            ['', 'SCM UI:'] +
            (endpoint_urls.scm | map('regex_replace', '^', '  - ') | list) +
            ['', 'Recon UI:'] +
            ['  - ' ~ ((endpoint_urls.recon + ['Not configured'])[0])] +
            ['', 'S3 Gateway (HTTP):'] +
            ['  - ' ~ ((endpoint_urls.s3g_http + ['Not configured'])[0])] +
            ['', 'S3 Gateway (Web Admin):'] +
            ['  - ' ~ ((endpoint_urls.s3g_admin + ['Not configured'])[0])] +
            ['', 'Datanode UI:'] +
            ['  - ' ~ ((endpoint_urls.datanode + ['Not configured'])[0])] +
            [
              '',
              '==========================================',
              'UI endpoints also saved to: ' ~ (controller_logs_dir | default('logs')) ~ '/endpoint_urls.json',
              '==========================================',
              ''
            ]
          }}
      run_once: true
      when: endpoint_urls is defined
      tags: ["always"]

    - name: "Display UI Endpoints Summary"
      debug:
        msg: "{{ ui_display_lines }}"
      run_once: true
      when: endpoint_urls is defined
      tags: ["always"]
