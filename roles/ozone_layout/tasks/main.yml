---
- name: "Create install, data (hdds.datanode.dir) and metadata directories"
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: "0755"
  loop: >-
    {{
      [install_base]
      + (data_base_list | default([data_base | default('/data/ozone')]) | map('regex_replace', '$', '/dn') | list)
      + (metadata_base_list | default([metadata_base | default(data_base) | default('/data/ozone')]) | product(['/meta', '/meta/dn', '/data/om', '/data/scm']) | map('join') | list)
    }}
  become: true

- name: "Remove system-wide ozone env (now set only for service user)"
  file:
    path: "/etc/profile.d/ozone.sh"
    state: absent
  become: true

- name: "Ensure OZONE_HOME and PATH in service user shell config"
  blockinfile:
    path: "{{ (service_user == 'root') | ternary('/root', '/home/' + service_user) }}/.bashrc"
    create: true
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: "0644"
    marker: "# {mark} {{ ENV_MARKER }}"
    block: |
      export OZONE_HOME="{{ install_base }}/current"
      export PATH="$PATH:{{ install_base }}/current/bin"
  become: true


