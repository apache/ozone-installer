---
- name: "Check install_base presence"
  stat:
    path: "{{ install_base }}"
  register: _st_install_base
  become: true

- name: "Set presence flag"
  set_fact:
    install_present: "{{ _st_install_base.stat.exists | default(false) }}"

- name: "Skip cleanup when install_base is absent on this host"
  debug:
    msg: "install_base '{{ install_base }}' not present; skipping cleanup on this host"
  when: not install_present
  changed_when: false

- name: "Remove install and data directories when install_base exists"
  when: install_present
  block:
    - name: "Remove Ozone env blocks from service user .bashrc"
      blockinfile:
        path: "{{ (service_user == 'root') | ternary('/root', '/home/' + service_user) }}/.bashrc"
        marker: "# {mark} {{ item }}"
        state: absent
        create: false
      loop:
        - "{{ JAVA_MARKER | default('Apache Ozone Installer Java Home') }}"
        - "{{ ENV_MARKER | default('Apache Ozone Installer Env') }}"
      become: true

    - name: "Remove install directory"
      file:
        path: "{{ install_base }}"
        state: absent
      become: true

    - name: "Remove data and metadata directories"
      file:
        path: "{{ item }}"
        state: absent
      loop: "{{ ((data_base_list | default([data_base | default('/data/ozone')])) + (metadata_base_list | default([metadata_base | default(data_base) | default('/data/ozone')]))) | unique }}"
      become: true


