---
- name: "Install awscli on S3G host"
  package:
    name: awscli
    state: present
  become: true

- name: "AWS CLI configure dummy credentials for S3G tests"
  shell: |
    set -euo pipefail
    aws configure set aws_access_key_id dummy
    aws configure set aws_secret_access_key dummy
  args:
    executable: /bin/bash

- name: "AWS CLI S3G: create test bucket '{{ s3g_bucket }}'"
  shell: |
    set -o pipefail
    aws s3api create-bucket --bucket {{ s3g_bucket }} --endpoint-url "http://{{ inventory_hostname }}:9878" || true
  args:
    executable: /bin/bash
  register: aws_create_result
  changed_when: false

- name: "AWS CLI S3G: list buckets"
  shell: |
    set -o pipefail
    aws s3api list-buckets --endpoint-url "http://{{ inventory_hostname }}:9878"
  args:
    executable: /bin/bash
  register: aws_list_result
  changed_when: false

- name: "Show AWS CLI S3G check output"
  debug:
    msg:
      - "Create bucket output: {{ (aws_create_result.stdout | default('')) }}"
      - "List buckets output: {{ (aws_list_result.stdout | default('')) }}"
